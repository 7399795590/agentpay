<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Top badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="#10b981" opacity="0.15"/>
    <circle cx="20" cy="20" r="5" fill="#10b981"/>
    <text x="35" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#10b981">API is LIVE · v0.1.0</text>
  </g>

  <!-- Logo -->
  <g transform="translate(80, 180)">
    <path d="M55 15 L25 55 L45 55 L40 85 L75 42 L53 42 Z" fill="url(#accent)" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="180" y="245" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff">AgentPay</text>

  <!-- Main headline -->
  <text x="80" y="360" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Payments for</text>
  <text x="80" y="440" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="url(#accent)">AI Agents</text>

  <!-- Subtitle -->
  <text x="80" y="500" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">Give your AI agents a wallet. Simple API. Works with Claude, GPT, LangChain.</text>

  <!-- Bottom URL -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="18" fill="#64748b">agentpay-pearl.vercel.app</text>
  </g>

  <!-- Code snippet decoration (right side) -->
  <g transform="translate(720, 240)" opacity="0.7">
    <rect x="0" y="0" width="420" height="280" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Traffic lights -->
    <circle cx="25" cy="25" r="6" fill="#ef4444" opacity="0.7"/>
    <circle cx="45" cy="25" r="6" fill="#eab308" opacity="0.7"/>
    <circle cx="65" cy="25" r="6" fill="#22c55e" opacity="0.7"/>
    <line x1="0" y1="45" x2="420" y2="45" stroke="#1e293b" stroke-width="1"/>

    <!-- Code lines -->
    <text x="20" y="80" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">$ curl -X POST \</text>
    <text x="20" y="105" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">  /agents/create \</text>
    <text x="20" y="130" font-family="ui-monospace, monospace" font-size="13" fill="#fbbf24">  -d '{"name":"my-agent"}'</text>

    <text x="20" y="175" font-family="ui-monospace, monospace" font-size="13" fill="#64748b"># Response:</text>
    <text x="20" y="200" font-family="ui-monospace, monospace" font-size="13" fill="#22d3ee">{"ok": true,</text>
    <text x="20" y="220" font-family="ui-monospace, monospace" font-size="13" fill="#22d3ee"> "api_key": "ap_***"}</text>
  </g>

</svg>
