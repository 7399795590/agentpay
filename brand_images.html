<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPay — Brand Images</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; padding: 0; background: #1a1a1a; display: flex; flex-direction: column; gap: 40px; padding: 40px 20px; align-items: center; font-family: system-ui, -apple-system, sans-serif; }
  .label { color: #888; font-size: 12px; text-align: center; margin-bottom: 8px; }
  .profile-img { width: 400px; height: 400px; background: #0a0a0a; border-radius: 80px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .profile-img::before { content: ''; position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); }
  .bolt { position: relative; width: 200px; height: 200px; }
  .bolt svg { width: 100%; height: 100%; filter: drop-shadow(0 0 30px rgba(59,130,246,0.6)); }
  .banner { width: 1500px; height: 500px; background: linear-gradient(135deg, #0a0a0a 0%, #0f172a 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 60px 80px; box-sizing: border-box; }
  .banner::before { content: ''; position: absolute; top: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%); border-radius: 50%; }
  .banner-logo { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; position: relative; z-index: 2; }
  .banner-bolt { width: 80px; height: 80px; }
  .banner-brand { font-size: 60px; font-weight: 800; color: white; letter-spacing: -2px; }
  .banner-tagline { font-size: 42px; font-weight: 700; color: white; line-height: 1.2; position: relative; z-index: 2; }
  .banner-tagline span { color: #3b82f6; }
  .banner-sub { font-size: 20px; color: #94a3b8; margin-top: 20px; position: relative; z-index: 2; }
  .banner-url { position: absolute; bottom: 40px; left: 80px; font-size: 18px; color: #475569; font-family: 'Courier New', monospace; z-index: 2; }
  @media (max-width: 1600px) {
    .banner { transform: scale(0.6); transform-origin: top left; margin-bottom: -200px; }
  }
</style>
</head>
<body>

<!-- Profile Image 400x400 -->
<div>
  <div class="label">📸 Profile Image — 400×400 — screenshot this</div>
  <div class="profile-img" id="profile">
    <div class="bolt">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 15 L25 55 L45 55 L40 85 L75 42 L53 42 Z" 
              fill="#3b82f6" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>

<!-- Banner 1500x500 -->
<div>
  <div class="label">🖼️ Banner Image — 1500×500 — screenshot this (scroll horizontally if needed)</div>
  <div class="banner" id="banner">
    <div class="banner-logo">
      <svg class="banner-bolt" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 15 L25 55 L45 55 L40 85 L75 42 L53 42 Z" 
              fill="#3b82f6" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div class="banner-brand">AgentPay</div>
    </div>
    <div class="banner-tagline">Payments for <span>AI Agents</span></div>
    <div class="banner-sub">Give your agents a wallet — API keys, balances, subscriptions.</div>
    <div class="banner-url">agentpay-pearl.vercel.app</div>
  </div>
</div>

</body>
</html>
