name: AgentPay Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: |
          python -c "import ast; ast.parse(open('app.py').read()); print('app.py OK')"
          python -c "import ast; ast.parse(open('database.py').read()); print('database.py OK')"
          python -c "import ast; ast.parse(open('models.py').read()); print('models.py OK')"

      - name: Import test
        run: python -c "from app import app; print('App imports OK')"
